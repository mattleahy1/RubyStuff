<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Space Invaders</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%;
      background: #000;
      overflow: hidden;
      font-family: 'Courier New', monospace;
      touch-action: manipulation;
    }
    #gameCanvas {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      display: block;
      image-rendering: pixelated;
    }
    #ui {
      position: fixed;
      top: 0; left: 0; right: 0;
      display: flex;
      justify-content: space-between;
      padding: 8px 16px;
      color: #0f0;
      font-size: 16px;
      pointer-events: none;
      z-index: 10;
    }
    #controls {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      padding: 12px;
      z-index: 10;
      pointer-events: none;
    }
    .btn-group { display: flex; gap: 10px; pointer-events: all; }
    .ctrl-btn {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      border: 3px solid #0f0;
      background: rgba(0,255,0,0.15);
      color: #0f0;
      font-size: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      user-select: none;
      -webkit-user-select: none;
      cursor: pointer;
      transition: background 0.1s;
    }
    .ctrl-btn:active, .ctrl-btn.pressed {
      background: rgba(0,255,0,0.45);
    }
    #fireBtn {
      width: 80px;
      height: 80px;
      border-color: #f00;
      background: rgba(255,0,0,0.15);
      color: #f00;
      font-size: 22px;
      pointer-events: all;
    }
    #fireBtn:active, #fireBtn.pressed {
      background: rgba(255,0,0,0.45);
    }
    #overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.85);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #0f0;
      z-index: 20;
      cursor: pointer;
      touch-action: manipulation;
    }
    #overlay h1 { font-size: 36px; margin-bottom: 16px; text-shadow: 0 0 20px #0f0; }
    #overlay p  { font-size: 16px; margin-bottom: 8px; color: #8f8; }
    #overlay .score { font-size: 22px; margin: 16px 0; }
  </style>
</head>
<body>
  <div id="ui">
    <span id="scoreDisplay">SCORE: 0</span>
    <span id="livesDisplay">&#9829;&#9829;&#9829;</span>
    <span id="levelDisplay">LV 1</span>
  </div>

  <canvas id="gameCanvas"></canvas>

  <div id="controls">
    <div class="btn-group">
      <div class="ctrl-btn" id="leftBtn">&#9664;</div>
      <div class="ctrl-btn" id="rightBtn">&#9654;</div>
    </div>
    <div id="fireBtn" class="ctrl-btn">FIRE</div>
  </div>

  <div id="overlay">
    <h1>SPACE INVADERS</h1>
    <p>Destroy all aliens before they reach you!</p>
    <p style="margin-top:20px; color:#ff0; font-size:22px; letter-spacing:2px;">TAP ANYWHERE TO START</p>
  </div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

// ââ Layout ââââââââââââââââââââââââââââââââââââââââââââââââââââââââââââââââââââ
const CTRL_H = 100;
const UI_H   = 44;

function resize() {
  const vp = window.visualViewport;
  canvas.width  = vp ? vp.width  : window.innerWidth;
  canvas.height = vp ? vp.height : window.innerHeight;
}
resize();
const onResize = () => { resize(); if (!game.over && !game.paused) initLevel(); };
window.addEventListener('resize', onResize);
if (window.visualViewport) window.visualViewport.addEventListener('resize', onResize);
window.addEventListener('orientationchange', () => setTimeout(onResize, 200));

// Block pinch-zoom on iOS
document.addEventListener('gesturestart',  e => e.preventDefault(), { passive: false });
document.addEventListener('gesturechange', e => e.preventDefault(), { passive: false });
document.addEventListener('touchmove', e => {
  if (e.touches.length > 1) e.preventDefault();
}, { passive: false });

// ââ Constants âââââââââââââââââââââââââââââââââââââââââââââââââââââââââââââââââ
const ALIEN_ROWS  = 4;
const ALIEN_COLS  = 10;
const BULLET_SPD  = 9;
const BOMB_SPD    = 3.5;
const PLAYER_SPD  = 5;
const SHIELD_COUNT = 4;

const ALIEN_COLORS = ['#f0f', '#0ff', '#ff0', '#f80'];

// ââ Game state ââââââââââââââââââââââââââââââââââââââââââââââââââââââââââââââââ
let game = {
  score: 0, lives: 3, level: 1,
  over: true, paused: false, started: false,
  hiScore: 0
};

let player = null;
let aliens = [], bullets = [], bombs = [], shields = [], particles = [];
let alienDir = 1, alienDropping = false, bombTimer = 120, mysteryShip = null;
let alienStepTimer = 0;
let keys = { left: false, right: false, fire: false };
let lastFire = 0;

// ââ Audio Engine ââââââââââââââââââââââââââââââââââââââââââââââââââââââââââââââ
let audioCtx = null;
let marchNote = 0;
const MARCH_FREQS = [160, 110, 130, 90]; // classic 4-note cycle
let mysteryOsc = null, mysteryGain = null;

function getAudio() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}

function playTone(freq, type, duration, volume, startTime, freqEnd) {
  try {
    const ac = getAudio();
    const osc = ac.createOscillator();
    const gain = ac.createGain();
    osc.connect(gain);
    gain.connect(ac.destination);
    osc.type = type;
    osc.frequency.setValueAtTime(freq, startTime);
    if (freqEnd !== undefined) {
      osc.frequency.linearRampToValueAtTime(freqEnd, startTime + duration);
    }
    gain.gain.setValueAtTime(volume, startTime);
    gain.gain.exponentialRampToValueAtTime(0.001, startTime + duration);
    osc.start(startTime);
    osc.stop(startTime + duration + 0.01);
  } catch(e) {}
}

function soundShoot() {
  try {
    const ac = getAudio();
    const t = ac.currentTime;
    playTone(900, 'square', 0.09, 0.15, t, 200);
  } catch(e) {}
}

function soundAlienDie() {
  try {
    const ac = getAudio();
    const t = ac.currentTime;
    const bufSize = Math.floor(ac.sampleRate * 0.18);
    const buf = ac.createBuffer(1, bufSize, ac.sampleRate);
    const data = buf.getChannelData(0);
    for (let i = 0; i < bufSize; i++) data[i] = Math.random() * 2 - 1;
    const src = ac.createBufferSource();
    src.buffer = buf;
    const g = ac.createGain();
    src.connect(g); g.connect(ac.destination);
    g.gain.setValueAtTime(0.35, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.18);
    src.start(t); src.stop(t + 0.2);
  } catch(e) {}
}

function soundMysteryHit() {
  stopMysterySound();
  try {
    const ac = getAudio();
    const t = ac.currentTime;
    // Quick ascending fanfare
    [500, 650, 820, 1100].forEach((f, i) => {
      playTone(f, 'square', 0.08, 0.25, t + i * 0.065);
    });
  } catch(e) {}
}

function soundPlayerDie() {
  try {
    const ac = getAudio();
    const t = ac.currentTime;
    // Descending death sequence
    [440, 360, 290, 230, 185, 145, 110, 75].forEach((f, i) => {
      playTone(f, 'sawtooth', 0.11, 0.35, t + i * 0.08, f * 0.55);
    });
  } catch(e) {}
}

function soundMarch() {
  try {
    const ac = getAudio();
    const t = ac.currentTime;
    const freq = MARCH_FREQS[marchNote % 4];
    marchNote = (marchNote + 1) % 4;
    playTone(freq, 'square', 0.065, 0.45, t);
  } catch(e) {}
}

function startMysterySound() {
  if (mysteryOsc) return;
  try {
    const ac = getAudio();
    mysteryOsc  = ac.createOscillator();
    mysteryGain = ac.createGain();
    // LFO for classic warble
    const lfo     = ac.createOscillator();
    const lfoGain = ac.createGain();
    lfo.frequency.value = 25;
    lfoGain.gain.value  = 180;
    lfo.connect(lfoGain);
    lfoGain.connect(mysteryOsc.frequency);
    mysteryOsc.type = 'sawtooth';
    mysteryOsc.frequency.value = 480;
    mysteryOsc.connect(mysteryGain);
    mysteryGain.connect(ac.destination);
    mysteryGain.gain.value = 0.1;
    lfo.start();
    mysteryOsc.start();
  } catch(e) { mysteryOsc = null; mysteryGain = null; }
}

function stopMysterySound() {
  if (!mysteryOsc) return;
  try { mysteryOsc.stop(); } catch(e) {}
  try { mysteryGain.disconnect(); } catch(e) {}
  mysteryOsc  = null;
  mysteryGain = null;
}

// ââ Sprites (pixel art via canvas) âââââââââââââââââââââââââââââââââââââââââââ
function drawAlien(x, y, size, row, frame) {
  const cx = x + size / 2, cy = y + size / 2;
  ctx.fillStyle = ALIEN_COLORS[row % ALIEN_COLORS.length];
  ctx.shadowColor = ctx.fillStyle;
  ctx.shadowBlur = 8;

  if (row === 0) {
    ctx.beginPath();
    ctx.ellipse(cx, cy - size*0.1, size*0.38, size*0.28, 0, 0, Math.PI*2);
    ctx.fill();
    const legs = frame ? [-0.3, 0, 0.3] : [-0.15, 0.15];
    legs.forEach(ox => {
      ctx.fillRect(cx + ox*size - 2, cy + size*0.12, 4, size*0.22);
    });
  } else if (row === 1) {
    ctx.fillRect(cx - size*0.32, cy - size*0.18, size*0.64, size*0.36);
    [[-.42,-.12,.1,.22],[.32,-.12,.1,.22]].forEach(([rx,ry,rw,rh]) =>
      ctx.fillRect(cx+rx*size, cy+ry*size, rw*size, rh*size));
    const antX = frame ? [-.28,.28] : [-.22,.22];
    antX.forEach(ax => ctx.fillRect(cx+ax*size-1, cy-size*.38, 2, size*.22));
  } else if (row === 2) {
    ctx.beginPath();
    ctx.moveTo(cx, cy - size*.3);
    ctx.lineTo(cx + size*.3, cy + size*.2);
    ctx.lineTo(cx + size*.1, cy + size*.1);
    ctx.lineTo(cx, cy + size*.3);
    ctx.lineTo(cx - size*.1, cy + size*.1);
    ctx.lineTo(cx - size*.3, cy + size*.2);
    ctx.closePath();
    ctx.fill();
    if (frame) {
      ctx.fillRect(cx - size*.2, cy - size*.05, 6, 6);
      ctx.fillRect(cx + size*.1, cy - size*.05, 6, 6);
    }
  } else {
    ctx.beginPath();
    ctx.arc(cx, cy, size*0.28, 0, Math.PI*2);
    ctx.fill();
    const w = frame ? 4 : 6;
    [[-1,0],[1,0],[0,-1],[0,1]].forEach(([dx,dy]) =>
      ctx.fillRect(cx+dx*size*.32-w/2, cy+dy*size*.32-w/2, w, w));
  }
  ctx.shadowBlur = 0;
}

function drawPlayer(p) {
  const x = p.x, y = p.y, w = p.w, h = p.h;
  ctx.shadowColor = '#0f0';
  ctx.shadowBlur = 18;
  ctx.fillStyle = '#0f0';
  ctx.fillRect(x, y + h * .55, w, h * .45);
  ctx.fillRect(x + w * .2, y + h * .25, w * .6, h * .35);
  ctx.fillRect(x + w * .42, y, w * .16, h * .32);
  ctx.shadowBlur = 0;
  ctx.fillStyle = '#afffaf';
  ctx.fillRect(x + w * .1, y + h * .58, w * .8, h * .12);
  ctx.fillRect(x + w * .28, y + h * .28, w * .44, h * .1);
  ctx.fillRect(x + w * .44, y + h * .02, w * .12, h * .1);
}

// ââ Particles ââââââââââââââââââââââââââââââââââââââââââââââââââââââââââââââââ
function spawnParticles(x, y, color, n = 12) {
  for (let i = 0; i < n; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = 1 + Math.random() * 4;
    particles.push({
      x, y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      life: 1,
      color,
      size: 2 + Math.random() * 3
    });
  }
}

function updateParticles() {
  particles = particles.filter(p => {
    p.x += p.vx; p.y += p.vy;
    p.vy += 0.1;
    p.life -= 0.04;
    if (p.life > 0) {
      ctx.globalAlpha = p.life;
      ctx.fillStyle = p.color;
      ctx.fillRect(p.x, p.y, p.size, p.size);
      ctx.globalAlpha = 1;
    }
    return p.life > 0;
  });
}

// ââ Shield ââââââââââââââââââââââââââââââââââââââââââââââââââââââââââââââââââââ
function buildShields() {
  shields = [];
  const sw = Math.min(60, canvas.width / (SHIELD_COUNT * 2));
  const sh = sw * 0.7;
  const spacing = canvas.width / (SHIELD_COUNT + 1);
  const sy = canvas.height - CTRL_H - 100;

  for (let i = 0; i < SHIELD_COUNT; i++) {
    const sx = spacing * (i + 1) - sw / 2;
    const blocks = [];
    const cols = 8, rows = 5;
    const bw = sw / cols, bh = sh / rows;
    for (let r = 0; r < rows; r++) {
      for (let c = 0; c < cols; c++) {
        if ((r === 0 && (c === 0 || c === cols-1)) ||
            (r === rows-1 && (c >= cols/2-1 && c <= cols/2))) continue;
        blocks.push({ x: sx + c*bw, y: sy + r*bh, w: bw, h: bh, alive: true });
      }
    }
    shields.push(blocks);
  }
}

function drawShields() {
  ctx.fillStyle = '#0a0';
  shields.forEach(s => s.forEach(b => { if (b.alive) ctx.fillRect(b.x, b.y, b.w, b.h); }));
}

function hitsShield(bx, by, bw, bh) {
  for (const s of shields) {
    for (const b of s) {
      if (b.alive && bx < b.x+b.w && bx+bw > b.x && by < b.y+b.h && by+bh > b.y) {
        b.alive = false;
        return true;
      }
    }
  }
  return false;
}

// ââ Level init ââââââââââââââââââââââââââââââââââââââââââââââââââââââââââââââââ
function initLevel() {
  const W = Math.max(canvas.width,  window.innerWidth,  320);
  const H = Math.max(canvas.height, window.innerHeight, 568);
  canvas.width = W; canvas.height = H;

  const colGap  = 1.5;
  const rowGap  = 1.6;
  const alienSize = Math.min(40, Math.floor((W - 40) / (ALIEN_COLS * colGap)));
  const formW  = alienSize * colGap * ALIEN_COLS;
  const padX   = Math.max(8, (W - formW) / 2);
  const startY = UI_H + alienSize * 1.5;

  aliens = [];
  for (let r = 0; r < ALIEN_ROWS; r++) {
    for (let c = 0; c < ALIEN_COLS; c++) {
      aliens.push({
        x: padX + c * alienSize * colGap,
        y: startY + r * alienSize * rowGap,
        w: alienSize, h: alienSize,
        row: r, alive: true, frame: 0
      });
    }
  }

  const pw = alienSize * 1.6;
  const ph = alienSize * 0.9;
  if (!player) {
    player = { x: W/2 - pw/2, y: H - CTRL_H - ph - 16, w: pw, h: ph };
  } else {
    player.y = H - CTRL_H - ph - 16;
    player.w = pw; player.h = ph;
  }

  bullets   = [];
  bombs     = [];
  particles = [];
  alienDir      = 1;
  alienDropping = false;
  alienStepTimer = 0;
  bombTimer     = 120;
  stopMysterySound();
  mysteryShip = null;
  marchNote   = 0;

  buildShields();
}

// ââ Input âââââââââââââââââââââââââââââââââââââââââââââââââââââââââââââââââââââ
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft')  keys.left  = true;
  if (e.key === 'ArrowRight') keys.right = true;
  if (e.key === ' ' || e.key === 'z') keys.fire = true;
});
document.addEventListener('keyup', e => {
  if (e.key === 'ArrowLeft')  keys.left  = false;
  if (e.key === 'ArrowRight') keys.right = false;
  if (e.key === ' ' || e.key === 'z') keys.fire = false;
});

function addTouchBtn(el, key) {
  el.addEventListener('touchstart', e => { e.preventDefault(); keys[key] = true;  el.classList.add('pressed'); }, { passive: false });
  el.addEventListener('touchend',   e => { e.preventDefault(); keys[key] = false; el.classList.remove('pressed'); }, { passive: false });
}
addTouchBtn(document.getElementById('leftBtn'),  'left');
addTouchBtn(document.getElementById('rightBtn'), 'right');
addTouchBtn(document.getElementById('fireBtn'),  'fire');

let touchStartX = null;
canvas.addEventListener('touchstart', e => { touchStartX = e.touches[0].clientX; }, { passive: true });
canvas.addEventListener('touchmove', e => {
  if (touchStartX === null) return;
  const dx = e.touches[0].clientX - touchStartX;
  if (dx < -10) { keys.left = true; keys.right = false; }
  else if (dx > 10) { keys.right = true; keys.left = false; }
}, { passive: true });
canvas.addEventListener('touchend', () => {
  keys.left = false; keys.right = false; touchStartX = null;
}, { passive: true });

// ââ Game logic ââââââââââââââââââââââââââââââââââââââââââââââââââââââââââââââââ
let frame = 0;
let alienAnimTimer = 0;
let alienAnimFrame = 0;

function fireBullet() {
  const now = Date.now();
  if (now - lastFire < 350) return;
  if (bullets.filter(b => !b.enemy).length >= 3) return;
  lastFire = now;
  bullets.push({ x: player.x + player.w/2 - 2, y: player.y - 8, w: 4, h: 14, enemy: false });
  soundShoot();
}

function alienBomb() {
  const alive = aliens.filter(a => a.alive);
  if (!alive.length) return;
  const shooter = alive[Math.floor(Math.random() * alive.length)];
  bombs.push({ x: shooter.x + shooter.w/2 - 3, y: shooter.y + shooter.h, w: 6, h: 14 });
}

function update() {
  if (game.over || game.paused) return;

  frame++;

  // Player move
  if (keys.left)  player.x = Math.max(0, player.x - PLAYER_SPD);
  if (keys.right) player.x = Math.min(canvas.width - player.w, player.x + PLAYER_SPD);
  if (keys.fire)  fireBullet();

  // Alien animation
  alienAnimTimer++;
  if (alienAnimTimer > 20) { alienAnimTimer = 0; alienAnimFrame ^= 1; }

  // Alien step-based movement
  const alive = aliens.filter(a => a.alive);
  if (!alive.length) { nextLevel(); return; }

  const totalAliens = ALIEN_ROWS * ALIEN_COLS;
  const baseInterval = Math.max(50 - (game.level - 1) * 5, 20);
  const stepInterval = Math.max(2, Math.round(baseInterval * alive.length / totalAliens));
  const STEP_PX = 6;

  alienStepTimer++;
  if (alienStepTimer >= stepInterval) {
    alienStepTimer = 0;
    const leftmost  = Math.min(...alive.map(a => a.x));
    const rightmost = Math.max(...alive.map(a => a.x + a.w));

    if ((alienDir < 0 && leftmost  - STEP_PX < 8) ||
        (alienDir > 0 && rightmost + STEP_PX > canvas.width - 8)) {
      aliens.forEach(a => { a.y += 20; });
      alienDir *= -1;
    } else {
      aliens.forEach(a => { a.x += alienDir * STEP_PX; });
    }
    soundMarch(); // â classic march sound on every step
  }

  // Alien reached player row?
  if (alive.some(h => a.y + a.h >= player.y)) { die(); return; }

  // Bombs
  bombTimer--;
  if (bombTimer <= 0) {
    alienBomb();
    bombTimer = Math.max(30, 110 - game.level * 8 - (ALIEN_ROWS*ALIEN_COLS - alive.length) * 0.4);
  }

  // Mystery ship
  if (!mysteryShip && Math.random() < 0.001) {
    mysteryShip = { x: -60, y: UI_H + 12, w: 56, h: 24, dir: 1, speed: 2.5 };
    startMysterySound();
  }
  if (mysteryShip) {
    mysteryShip.x += mysteryShip.dir * mysteryShip.speed;
    if (mysteryShip.x > canvas.width + 60) {
      mysteryShip = null;
      stopMysterySound();
    }
  }

  // Move bullets
  bullets = bullets.filter(b => {
    b.y -= BULLET_SPD;
    return b.y > -20;
  });

  // Move bombs
  bombs = bombs.filter(b => {
    b.y += BOMB_SPD;
    if (b.y > canvas.height) return false;
    if (hitsShield(b.x, b.y, b.w, b.h)) return false;
    return true;
  });

  // Bullet hits shield
  bullets = bullets.filter(b => {
    if (hitsShield(b.x, b.y, b.w, b.h)) return false;
    return true;
  });

  // Bullet hits alien
  bullets = bullets.filter(b => {
    for (const a of aliens) {
      if (!a.alive) continue;
      if (b.x < a.x+a.w && b.x+b.w > a.x && b.y < a.y+a.h && b.y+b.h > a.y) {
        a.alive = false;
        const pts = (ALIEN_ROWS - a.row) * 10;
        game.score += pts;
        spawnParticles(a.x + a.w/2, a.y + a.h/2, ALIEN_COLORS[a.row % ALIEN_COLORS.length]);
        soundAlienDie();
        updateUI();
        return false;
      }
    }
    return true;
  });

  // Bullet hits mystery ship
  // IMPORTANT: check mysteryShip inside the callback too â a previous bullet in the
  // same frame may have already nulled it, which would crash on property access.
  if (mysteryShip) {
    bullets = bullets.filter(b => {
      if (!mysteryShip) return true; // already destroyed this frame
      if (b.x < mysteryShip.x+mysteryShip.w && b.x+b.w > mysteryShip.x &&
          b.y < mysteryShip.y+mysteryShip.h && b.y+b.h > mysteryShip.y) {
        game.score += 100 + Math.floor(Math.random() * 5) * 50;
        spawnParticles(mysteryShip.x + mysteryShip.w/2, mysteryShip.y + mysteryShip.h/2, '#f0f', 20);
        soundMysteryHit();
        mysteryShip = null; // safe: guarded above for subsequent bullets
        updateUI();
        return false;
      }
      return true;
    });
  }

  // Bomb hits player
  bombs = bombs.filter(b => {
    if (b.x < player.x+player.w && b.x+b.w > player.x &&
        b.y < player.y+player.h && b.y+b.h > player.y) {
      spawnParticles(player.x + player.w/2, player.y + player.h/2, '#0f0', 20);
      die();
      return false;
    }
    return true;
  });
}

function die() {
  soundPlayerDie();
  game.lives--;
  updateUI();
  if (game.lives <= 0) {
    game.over = true;
    stopMysterySound();
    showOverlay('GAME OVER', `SCORE: ${game.score}`);
  } else {
    player.x = canvas.width / 2 - player.w / 2;
    bullets = []; bombs = [];
  }
}

function nextLevel() {
  game.level++;
  updateUI();
  initLevel();
}

// ââ Render ââââââââââââââââââââââââââââââââââââââââââââââââââââââââââââââââââââ
function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // Starfield
  ctx.fillStyle = '#fff';
  for (let i = 0; i < 60; i++) {
    const sx = ((i * 137 + frame * 0.3) % canvas.width);
    const sy = ((i * 97  + frame * 0.15 * (i % 3 + 1)) % (canvas.height));
    const sz = i % 3 === 0 ? 2 : 1;
    ctx.globalAlpha = 0.3 + (i % 4) * 0.15;
    ctx.fillRect(sx, sy, sz, sz);
  }
  ctx.globalAlpha = 1;

  // Aliens
  aliens.forEach(a => {
    if (a.alive) drawAlien(a.x, a.y, a.w, a.row, alienAnimFrame);
  });

  // Mystery ship
  if (mysteryShip) {
    ctx.fillStyle = '#f0f';
    ctx.shadowColor = '#f0f';
    ctx.shadowBlur = 10;
    const m = mysteryShip;
    ctx.beginPath();
    ctx.ellipse(m.x + m.w/2, m.y + m.h/2, m.w/2, m.h/2, 0, 0, Math.PI*2);
    ctx.fill();
    ctx.fillStyle = '#f88';
    ctx.fillRect(m.x + m.w*.2, m.y + m.h*.2, m.w*.6, m.h*.3);
    ctx.shadowBlur = 0;
  }

  // Shields
  drawShields();

  // Player
  if (!game.over) drawPlayer(player);

  // Bullets
  ctx.fillStyle = '#ff0';
  ctx.shadowColor = '#ff0';
  ctx.shadowBlur = 8;
  bullets.forEach(b => ctx.fillRect(b.x, b.y, b.w, b.h));

  // Bombs
  ctx.fillStyle = '#f44';
  ctx.shadowColor = '#f44';
  ctx.shadowBlur = 6;
  bombs.forEach(b => {
    ctx.save();
    ctx.translate(b.x + b.w/2, b.y + b.h/2);
    ctx.rotate(frame * 0.2);
    ctx.fillRect(-b.w/2, -b.h/2, b.w, b.h);
    ctx.restore();
  });
  ctx.shadowBlur = 0;

  // Particles
  updateParticles();
}

// ââ Loop ââââââââââââââââââââââââââââââââââââââââââââââââââââââââââââââââââââââ
function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}

// ââ UI ââââââââââââââââââââââââââââââââââââââââââââââââââââââââââââââââââââââââ
function updateUI() {
  document.getElementById('scoreDisplay').textContent = `SCORE: ${game.score}`;
  document.getElementById('livesDisplay').textContent = 'â¥'.repeat(Math.max(0, game.lives));
  document.getElementById('levelDisplay').textContent = `LV ${game.level}`;
}

function showOverlay(title, scoreText) {
  if (game.score > game.hiScore) game.hiScore = game.score;
  const ov = document.getElementById('overlay');
  ov.innerHTML = `
    <h1>${title}</h1>
    <div class="score">${scoreText}</div>
    <p>HI: ${game.hiScore}</p>
    <p style="margin-top:20px; color:#ff0; font-size:22px; letter-spacing:2px;">TAP ANYWHERE TO START</p>
  `;
  ov.style.display = 'flex';
}

function startGame() {
  // Resume AudioContext â required after a user gesture on iOS/Chrome
  getAudio();
  document.getElementById('overlay').style.display = 'none';
  game.score = 0; game.lives = 3; game.level = 1; game.over = false;
  player = null;
  resize();
  initLevel();
  updateUI();
}

// ââ Boot ââââââââââââââââââââââââââââââââââââââââââââââââââââââââââââââââââââââ
const overlay = document.getElementById('overlay');
overlay.addEventListener('click', startGame);
overlay.addEventListener('touchstart', e => { e.preventDefault(); startGame(); }, { passive: false });
loop();
</script>
